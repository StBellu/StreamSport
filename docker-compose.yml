services:
  streamsport:
    build: .
    container_name: streamsport
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-7860}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-Europe/Rome}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-3600}
      SYNC_INTERVAL_SECONDS_NIGHT: ${SYNC_INTERVAL_SECONDS_NIGHT:-14400}
      EPG_SYNC_INTERVAL_SECONDS: ${EPG_SYNC_INTERVAL_SECONDS:-7200}
      THESPORTSDB_SYNC_INTERVAL_SECONDS: ${THESPORTSDB_SYNC_INTERVAL_SECONDS:-43200}
      MATCH_RETENTION_HOURS: ${MATCH_RETENTION_HOURS:-6}

      # Individual Data Source & Provider Toggles
      ENABLE_DIRETTA: ${ENABLE_DIRETTA:-true}
      ENABLE_SKY_EPG: ${ENABLE_SKY_EPG:-true}
      ENABLE_THESPORTSDB: ${ENABLE_THESPORTSDB:-true}
      ENABLE_TENNIS_POSTERS: ${ENABLE_TENNIS_POSTERS:-true}
      ENABLE_TVVOO: ${ENABLE_TVVOO:-true}
      ENABLE_MANDRAKODI: ${ENABLE_MANDRAKODI:-true}
      ENABLE_SPON: ${ENABLE_SPON:-true}
      ENABLE_DADDYLIVE: ${ENABLE_DADDYLIVE:-true}
      ENABLE_STREAMFREE: ${ENABLE_STREAMFREE:-true}
      ENABLE_FCTV33: ${ENABLE_FCTV33:-true}

      # Credentials & Endpoints
      THESPORTSDB_USER: ${THESPORTSDB_USER:-}
      THESPORTSDB_PASS: ${THESPORTSDB_PASS:-}
      MANDRAKODI_PASSWORD: ${MANDRAKODI_PASSWORD:-}
      MANDRAKODI_DEVICE_ID: ${MANDRAKODI_DEVICE_ID:-}
      MANDRAKODI_API_URL: ${MANDRAKODI_API_URL:-}
      MANDRAKODI_XOR_KEY: ${MANDRAKODI_XOR_KEY:-my_secret_key}
      FLASHSCORE_FSIGN: ${FLASHSCORE_FSIGN:-SW9D1eZo}
      STREAMFREE_DIRECTORY_URL: ${STREAMFREE_DIRECTORY_URL:-https://strmfree.link/api/domains}
      STREAMFREE_PRIMARY_MIRROR: ${STREAMFREE_PRIMARY_MIRROR:-strmfree.pk}
      STREAMFREE_FALLBACK_MIRRORS: ${STREAMFREE_FALLBACK_MIRRORS:-strmfree.st,streamfree.top}
      FCTV33_API_BASE: ${FCTV33_API_BASE:-https://apis-data10.tcpwe138stya.ru}
      SPON_PRIMARY_URL: ${SPON_PRIMARY_URL:-https://sportsonline.st/prog.txt}
      SPON_FALLBACK_URL: ${SPON_FALLBACK_URL:-https://sportsonline.cx/prog.txt}
      SPON_CACHE_TTL: ${SPON_CACHE_TTL:-7200}
      DEFAULT_EP_URL: ${DEFAULT_EP_URL:-}
      DEFAULT_EP_PASS: ${DEFAULT_EP_PASS:-}
      PUBLIC_URL: ${PUBLIC_URL:-}

      # Modular Outbound Proxy Routing (empty=inherit GLOBAL_PROXY, "direct"=bypass)
      GLOBAL_PROXY: ${GLOBAL_PROXY:-}
      DIRETTA_PROXY: ${DIRETTA_PROXY:-}
      SKY_EPG_PROXY: ${SKY_EPG_PROXY:-}
      THESPORTSDB_PROXY: ${THESPORTSDB_PROXY:-}
      TENNIS_POSTERS_PROXY: ${TENNIS_POSTERS_PROXY:-}
      TVVOO_PROXY: ${TVVOO_PROXY:-}
      MANDRAKODI_PROXY: ${MANDRAKODI_PROXY:-}
      SPON_PROXY: ${SPON_PROXY:-}
      DADDYLIVE_PROXY: ${DADDYLIVE_PROXY:-}
      STREAMFREE_PROXY: ${STREAMFREE_PROXY:-}
      FCTV33_PROXY: ${FCTV33_PROXY:-}

  warp:
    image: caomingjun/warp:latest
    container_name: warp
    restart: unless-stopped
    device_cgroup_rules:
      - "c 10:200 rwm"
    environment:
      WARP_SLEEP: ${WARP_SLEEP:-2}
      WARP_LICENSE_KEY: ${WARP_LICENSE_KEY:-}
    cap_add:
      - NET_ADMIN
      - MKNOD
      - AUDIT_WRITE
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv4.conf.all.src_valid_mark: 1
    volumes:
      - ./data/warp:/var/lib/cloudflare-warp
